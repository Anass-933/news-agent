<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Agent — Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }

    header h1 { font-size: 1.4rem; }
    header h1 span { color: #e94560; }

    header nav a {
      color: rgba(255,255,255,.75);
      text-decoration: none;
      font-size: .85rem;
      margin-left: 1.25rem;
      transition: color .2s;
    }
    header nav a:hover { color: #fff; }
    header nav a.active { color: #e94560; font-weight: 600; }

    /* ---- Suggestions bar ---- */
    .suggestions {
      background: #fff;
      padding: .6rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    .suggestions span {
      font-size: .75rem;
      color: #888;
      align-self: center;
      margin-right: .25rem;
    }

    .chip {
      cursor: pointer;
      background: #f0f2f5;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: .3rem .75rem;
      font-size: .8rem;
      color: #444;
      transition: background .15s, color .15s;
      user-select: none;
    }
    .chip:hover { background: #0f3460; color: #fff; border-color: #0f3460; }

    /* ---- Chat window ---- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    .bubble-wrap.user { align-items: flex-end; }
    .bubble-wrap.agent { align-items: flex-start; }

    .bubble {
      padding: .75rem 1.1rem;
      border-radius: 14px;
      line-height: 1.5;
      font-size: .9rem;
      max-width: 85%;
    }

    .bubble-wrap.user .bubble {
      background: #0f3460;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble-wrap.agent .bubble {
      background: #fff;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* markdown-lite: bold */
    .bubble b { font-weight: 600; }

    /* Trending chips */
    .topic-chips {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .6rem;
    }

    .topic-chip {
      background: #e8f0fe;
      color: #1a56db;
      border-radius: 12px;
      padding: .25rem .7rem;
      font-size: .8rem;
      cursor: pointer;
      transition: background .15s;
    }
    .topic-chip:hover { background: #1a56db; color: #fff; }

    /* Article cards inside chat */
    .article-list {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      margin-top: .75rem;
      width: 100%;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }

    .acard {
      background: #fff;
      border-radius: 8px;
      padding: .85rem 1rem;
      border-left: 3px solid #e94560;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
      transition: box-shadow .2s, transform .2s;
    }

    .acard:hover { box-shadow: 0 3px 10px rgba(0,0,0,.1); transform: translateY(-1px); }

    .acard h3 {
      font-size: .9rem;
      margin-bottom: .2rem;
    }

    .acard h3 a { color: #1a1a2e; text-decoration: none; }
    .acard h3 a:hover { color: #e94560; }

    .acard .ameta {
      font-size: .73rem;
      color: #aaa;
      margin-bottom: .3rem;
    }

    .acard .asnippet {
      font-size: .82rem;
      color: #666;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Typing indicator */
    .typing .dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing .dot:nth-child(2) { animation-delay: .2s; }
    .typing .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ---- Input bar ---- */
    .input-bar {
      background: #fff;
      border-top: 1px solid #e0e0e0;
      padding: .9rem 1.5rem;
      display: flex;
      gap: .6rem;
      flex-shrink: 0;
    }

    #query-input {
      flex: 1;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      padding: .55rem 1.1rem;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }

    #query-input:focus { border-color: #0f3460; }

    #send-btn {
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: .55rem 1.4rem;
      font-size: .9rem;
      cursor: pointer;
      transition: background .2s;
    }

    #send-btn:hover { background: #e94560; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>📰 News <span>Agent</span></h1>
  <nav>
    <a href="/">Headlines</a>
    <a href="/agent" class="active">Agent Chat</a>
  </nav>
</header>

<div class="suggestions">
  <span>Try:</span>
  <div class="chip" onclick="sendQuery('Top stories digest')">📋 Digest</div>
  <div class="chip" onclick="sendQuery('What is trending?')">🔥 Trending</div>
  <div class="chip" onclick="sendQuery('climate change')">🌍 Climate</div>
  <div class="chip" onclick="sendQuery('artificial intelligence')">🤖 AI</div>
  <div class="chip" onclick="sendQuery('economy')">💹 Economy</div>
  <div class="chip" onclick="sendQuery('space')">🚀 Space</div>
  <div class="chip" onclick="sendQuery('health')">❤️ Health</div>
  <div class="chip" onclick="sendQuery('sources')">📡 Sources</div>
  <div class="chip" onclick="sendQuery('help')">❓ Help</div>
</div>

<div id="chat">
  <div class="bubble-wrap agent">
    <div class="bubble">
      👋 Hi! I'm your <b>News Agent</b>. I can search headlines, give you a digest, or show what's trending.<br><br>
      Ask me anything — like <em>"What's happening with AI?"</em> or just tap a suggestion above.
    </div>
  </div>
</div>

<div class="input-bar">
  <input id="query-input" type="text" placeholder="Ask about any topic…" autocomplete="off" />
  <button id="send-btn" onclick="handleSend()">Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('query-input');
  const sendBtn = document.getElementById('send-btn');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

  function sendQuery(text) {
    input.value = text;
    handleSend();
  }

  function handleSend() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    appendBubble('user', q);
    const typingId = appendTyping();
    sendBtn.disabled = true;

    fetch('/api/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q })
    })
    .then(r => r.json())
    .then(data => {
      removeEl(typingId);
      renderResponse(data);
    })
    .catch(() => {
      removeEl(typingId);
      appendBubble('agent', '⚠️ Something went wrong. Please try again.');
    })
    .finally(() => { sendBtn.disabled = false; input.focus(); });
  }

  function renderResponse(data) {
    // Render the text message (simple markdown: **bold**)
    const html = mdBold(escapeHtml(data.message || ''));
    appendBubble('agent', html, true);

    // Trending topics — render as clickable chips
    if (data.intent === 'trending' && data.topics && data.topics.length) {
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap agent';
      const chips = document.createElement('div');
      chips.className = 'topic-chips';
      data.topics.forEach(t => {
        const c = document.createElement('span');
        c.className = 'topic-chip';
        c.textContent = t;
        c.onclick = () => sendQuery(t);
        chips.appendChild(c);
      });
      wrap.appendChild(chips);
      chat.appendChild(wrap);
    }

    // Article cards
    if (data.articles && data.articles.length) {
      const list = document.createElement('div');
      list.className = 'article-list';
      data.articles.forEach(a => {
        const card = document.createElement('div');
        card.className = 'acard';
        card.innerHTML = `
          <h3><a href="${escapeAttr(a.link)}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></h3>
          <div class="ameta">${escapeHtml(a.source)}${a.published ? ' · ' + escapeHtml(a.published) : ''}</div>
          ${a.summary ? '<p class="asnippet">' + escapeHtml(a.summary.replace(/<[^>]+>/g, '')) + '</p>' : ''}
        `;
        list.appendChild(card);
      });
      chat.appendChild(list);
    }

    scrollBottom();
  }

  function appendBubble(role, text, isHtml = false) {
    const wrap = document.createElement('div');
    wrap.className = `bubble-wrap ${role}`;
    const bub = document.createElement('div');
    bub.className = 'bubble';
    if (isHtml) bub.innerHTML = text;
    else bub.textContent = text;
    wrap.appendChild(bub);
    chat.appendChild(wrap);
    scrollBottom();
    return wrap.id;
  }

  function appendTyping() {
    const id = 'typing-' + Date.now();
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap agent';
    wrap.id = id;
    wrap.innerHTML = '<div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    chat.appendChild(wrap);
    scrollBottom();
    return id;
  }

  function removeEl(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, '%22');
  }

  function mdBold(s) {
    return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  }
</script>

</body>
</html>
